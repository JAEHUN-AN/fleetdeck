services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fleetdeck-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket (브라우저에서 직접 구독할 때)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fleetdeck-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetdeck}
      POSTGRES_USER: ${POSTGRES_USER:-fleetdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      # 스키마는 백엔드의 Flyway 가 관리한다 (backend/src/main/resources/db/migration).
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetdeck} -d ${POSTGRES_DB:-fleetdeck}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: fleetdeck-simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SIM_MANUFACTURER: ${SIM_MANUFACTURER:-fleetdeck}
      SIM_ROBOT_COUNT: ${SIM_ROBOT_COUNT:-5}
      SIM_SORTER_COUNT: ${SIM_SORTER_COUNT:-2}
      SIM_TICK_SEC: ${SIM_TICK_SEC:-1.0}
      SIM_MAP_WIDTH: ${SIM_MAP_WIDTH:-40}
      SIM_MAP_HEIGHT: ${SIM_MAP_HEIGHT:-25}
      # OPC UA 서버. 광고 호스트를 서비스명으로 둬야 백엔드가 되돌아올 수 있다.
      SIM_OPCUA_ENABLED: ${SIM_OPCUA_ENABLED:-true}
      SIM_OPCUA_HOST: ${SIM_OPCUA_HOST:-simulator}
      SIM_OPCUA_PORT: ${SIM_OPCUA_PORT:-4840}
      SIM_OPCUA_SORTER_COUNT: ${SIM_OPCUA_SORTER_COUNT:-2}
    ports:
      - "${SIM_OPCUA_PORT:-4840}:4840"   # OPC UA (UaExpert 등으로 직접 붙어볼 때)
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fleetdeck-backend
    environment:
      FLEETDECK_MQTT_URL: tcp://mosquitto:1883
      FLEETDECK_OPCUA_URL: ${FLEETDECK_OPCUA_URL:-opc.tcp://simulator:4840/fleetdeck/server/}
      FLEETDECK_OPCUA_MODE: ${FLEETDECK_OPCUA_MODE:-SUBSCRIBE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fleetdeck}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleetdeck}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # 호스트 8080 은 다른 프로젝트가 쓰는 경우가 있어 8081 로 노출한다.
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
      db:
        condition: service_healthy
      simulator:
        condition: service_started
    restart: unless-stopped

volumes:
  mosquitto-data:
  db-data:
