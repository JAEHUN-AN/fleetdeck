server:
  port: 8080

spring:
  application:
    name: fleetdeck-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetdeck}
    username: ${SPRING_DATASOURCE_USERNAME:fleetdeck}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    # 이미 테이블이 있는 기존 DB(예전 infra/postgres/init 로 만든 것)는
    # baseline 처리해 V1 을 건너뛰고, 이후 버전부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "pre-flyway schema"

fleetdeck:
  mqtt:
    url: ${FLEETDECK_MQTT_URL:tcp://localhost:1883}
    client-id: ${FLEETDECK_MQTT_CLIENT_ID:fleetdeck-rcs}
    manufacturer: ${SIM_MANUFACTURER:fleetdeck}
  dispatch:
    # PENDING 미션 재시도 주기와 한 번에 처리할 건수
    interval: ${FLEETDECK_DISPATCH_INTERVAL:3s}
    batch-size: ${FLEETDECK_DISPATCH_BATCH:10}
    # 이 시간 동안 진전 없는 ASSIGNED/RUNNING 은 PENDING 으로 회수한다 (로봇 예약 TTL 겸용)
    stale-after: ${FLEETDECK_STALE_AFTER:60s}
    reclaim-interval: ${FLEETDECK_RECLAIM_INTERVAL:10s}
    # 회수 후 재배정 허용 횟수. 넘기면 FAILED 로 포기해 무한 재시도를 막는다.
    max-retries: ${FLEETDECK_MAX_RETRIES:3}
  wms:
    # 모의 WMS 주문 생성기. 실제 상위 시스템을 붙이면 끈다.
    enabled: ${FLEETDECK_WMS_ENABLED:true}
    interval: ${FLEETDECK_WMS_INTERVAL:12s}
    max-open-missions: ${FLEETDECK_WMS_MAX_OPEN:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.fleetdeck: INFO
    org.springframework.integration.mqtt: WARN
