# 로컬 개발용 설정. 운영에서는 allow_anonymous false + 인증 필수.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (브라우저 직접 구독용)
listener 9001
protocol websockets
allow_anonymous true
